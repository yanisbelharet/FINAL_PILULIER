<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- End TikTok Pixel Code -->
    <meta name="facebook-domain-verification" content="bzeqe49h9d1f6ejn1qy53t2zht6pmy" />
    <meta name="description" content="منبه وحافظة الدواء الذكية 4 أوقات - تخلص من القلق ونظم أدويتك بكل سهولة! متوفر مع شحن وتوصيل سريع والدفع عند الاستلام." />
    <title>منبه الدواء الذكي - اطلب الآن</title>

    <!-- DNS prefetch & Preconnect to critical CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://analytics.tiktok.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Preload Cairo Font -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" />
    </noscript>

    <!-- Preload LCP Hero Image -->
    <!-- (les landing pages /lp/ préchargent leur propre hero plus bas) -->
    <script>
      if (location.pathname.indexOf('/lp/') !== 0) {
        var c = document.createElement('link');
        c.rel = 'preconnect'; c.href = 'https://cdn.youcan.shop';
        document.head.appendChild(c);
        var h = document.createElement('link');
        h.rel = 'preload'; h.as = 'image'; h.setAttribute('fetchpriority', 'high');
        h.href = 'https://cdn.youcan.shop/stores/ba86712f261c8f3eed78e0e12a689855/others/HxVCmxikiwh6FWU4vOJ9898xYRoXH5n8uTCqLIP3.webp';
        document.head.appendChild(h);
      }
    </script>
    <!-- App mobile /app : manifeste d'installation (n'affecte pas les autres pages) -->
    <script>
      if (/^\/app(\/|$)/.test(location.pathname)) {
        var m = document.createElement('link'); m.rel = 'manifest'; m.href = '/app.webmanifest'; document.head.appendChild(m);
        var t = document.createElement('meta'); t.name = 'theme-color'; t.content = '#047857'; document.head.appendChild(t);
        var a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = '/app-icons/icon-192.png'; document.head.appendChild(a);
      }
    </script>
    <!-- Preload du hero des landing pages /lp/ (n'affecte pas les autres pages) -->
    <script>
      if (location.pathname.indexOf('/lp/pigma-400g') === 0) {
        // image principale de la page TikTok « 400 غرام مجانا » (même srcset que la balise <img>)
        var h = document.createElement('link');
        h.rel = 'preload'; h.as = 'image'; h.setAttribute('fetchpriority', 'high');
        h.setAttribute('imagesrcset', '/lp-assets/pigma400/hero-400g-640.webp 640w, /lp-assets/pigma400/hero-400g.webp 1080w');
        h.setAttribute('imagesizes', '(max-width: 576px) 100vw, 576px');
        document.head.appendChild(h);
      } else if (location.pathname.indexOf('/lp/') === 0) {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.setAttribute('fetchpriority', 'high');
        l.href = location.pathname.indexOf('/lp/proelastic') === 0 ? '/lp-assets/proelastic/pot-1kg.webp'
          : location.pathname.indexOf('/lp/pigma-stop-fuites') === 0 ? '/lp-assets/pigma/pot-transparent-1-4kg.webp'
          : location.pathname.indexOf('/lp/pigma-16kg') === 0 ? '/lp-assets/pigma/pots-1-4kg-5kg-pluie.webp'
          : '/lp-assets/med-alarm-hero.webp';
        document.head.appendChild(l);
        // fond du hero des pages Pigma (7 Ko) : c'est l'élément LCP de ces pages
        if (location.pathname.indexOf('/lp/pigma-stop-fuites') === 0 || location.pathname.indexOf('/lp/pigma-16kg') === 0) {
          var bg = document.createElement('link');
          bg.rel = 'preload'; bg.as = 'image'; bg.href = '/images/pigma/hero-rain-roof-sm.webp';
          document.head.appendChild(bg);
        }
      }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
